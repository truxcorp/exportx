# Install as .github/dependabot.yml. One weekly PR per ecosystem for minor and patch
# updates (the group); each major update gets its own PR.
version: 2
updates:
  - package-ecosystem: npm            # EDIT: one entry per ecosystem of the project
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
