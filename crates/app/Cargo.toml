[package]
name = "exportpro-app"
description = "ExportPro desktop app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "exportpro_app"
path = "src/lib.rs"

[[bin]]
name = "exportpro-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
exportpro-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
