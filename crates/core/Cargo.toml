[package]
name = "exportpro-core"
description = "ExportPro core: scan, plan, copy, erase and undo (no UI)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
nom-exif = "3.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
fs4 = "1.1.0"
sha2 = "0.11.2"
toml = "1.2.3"
trash = "5.4.0"
ureq = "3.5.2"
semver = "1.0.28"

[dev-dependencies]
tempfile = "3.27.0"
