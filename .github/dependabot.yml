# One weekly PR per ecosystem for minor and patch updates (the group); each major update
# gets its own PR. npm joins when the Tauri front end gets a package.json (slice 4).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
