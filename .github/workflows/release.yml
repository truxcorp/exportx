name: release
# A v<semver> tag (pushed by `make release V=...`, ADR 0007) builds the signed Linux and Mac
# bundles and publishes the GitHub Release with latest.json for the updater. Thin: make
# targets do the work (scripts/release.sh). The update key is a secret of the `release`
# environment, which only v* tags may use.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  TAG: ${{ github.ref_name }}
jobs:
  linux:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-26.04"') }}
    environment: release
    timeout-minutes: 40             # image build ~8 min when not cached, release build ~6 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make release-check V="${TAG#v}"
      - run: make box T=release-linux V="${TAG#v}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error
  macos:
    runs-on: macos-15               # Apple Silicon (arm64), GitHub-hosted
    environment: release
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make release-check V="${TAG#v}"
      - run: make release-macos V="${TAG#v}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [linux, macos]
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-26.04"') }}
    timeout-minutes: 10
    permissions:
      contents: write               # create the release and upload its files
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: make release-publish V="${TAG#v}" DIR=dist
        env:
          GH_TOKEN: ${{ github.token }}
