name: security
# New CVEs land on unchanged code: scan weekly and on demand. PRs already run
# `make security` in pr.yml (through make ci).
on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays, UTC, off the hour
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security
  cancel-in-progress: true
jobs:
  security:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-26.04"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: make ci T=security
