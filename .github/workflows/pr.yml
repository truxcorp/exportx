name: pr
# The only PR workflow (workflow kit, ci module). Thin on purpose: `make ci` builds the
# Containerfile image and runs lint, typecheck, unit tests and security in it, so the same
# checks run on a laptop and the CI host stays replaceable. Linux only, on GitHub-hosted
# runners (RUNNER_LABELS repo variable; public repo, so never self-hosted). No secrets here.
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ${{ fromJSON(vars.RUNNER_LABELS || '"ubuntu-26.04"') }}
    timeout-minutes: 40             # image build ~8 min when not cached, checks and e2e ~4 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # gitleaks scans every commit
          persist-credentials: false
      - run: make ci
      - name: Screenshots of the app's screens (end-to-end tests)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: target/box/e2e-screenshots/
          if-no-files-found: ignore
